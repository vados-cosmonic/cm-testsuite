name: setup-buck2
description: Install repository launchers and cache the checksum-pinned Buck2 tool downloads.

inputs:
  cache-address:
    description: Optional local REAPI cache address for GitHub-hosted Linux and macOS runners.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up launchers
      uses: $/.github/actions/setup-tools

    - name: Cache pinned tool downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/dotslash
          ~/Library/Caches/dotslash
          ~/AppData/Local/dotslash
        key: dotslash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bins/*') }}

    - name: Configure the Buck action cache
      if: inputs.cache-address != ''
      shell: bash
      env:
        CACHE_ADDRESS: ${{ inputs.cache-address }}
      # Host compilers are not Buck inputs; isolate results by runner image too.
      run: |
        : "${ImageOS:?Expected a GitHub-hosted runner image}"
        : "${ImageVersion:?Expected a GitHub-hosted runner image version}"
        {
          printf '[host_tools]\n  cache_identity = %s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          printf '[build]\n  execution_platforms = root//.buck/platforms:ci-cache\n'
          printf '[buck2]\n  default_allow_cache_upload = true\n'
          printf '[buck2_re_client]\n'
          printf '  action_cache_address = %s\n  cas_address = %s\n  engine_address = %s\n' \
            "$CACHE_ADDRESS" "$CACHE_ADDRESS" "$CACHE_ADDRESS"
          printf '  tls = false\n  capabilities = false\n'
        } > .buckconfig.local

    - name: Verify the repository Buck2 pin
      shell: bash
      run: dotslash bins/buck2 --version
