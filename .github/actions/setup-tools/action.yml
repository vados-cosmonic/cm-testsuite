name: setup-tools
description: Restore or install pinned Just and DotSlash binaries for repository commands.

runs:
  using: composite
  steps:
    - name: Restore tool binaries
      id: tools
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/just
          ~/.cargo/bin/just.exe
          ~/.cargo/bin/dotslash
          ~/.cargo/bin/dotslash.exe
        key: tools-${{ runner.os }}-${{ runner.arch }}-just-1.59.0-dotslash-0.5.7-v2

    - name: Install cargo-binstall
      if: steps.tools.outputs.cache-hit != 'true'
      uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
      with:
        version: 1.27.0

    - name: Install tool binaries
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cargo binstall --no-confirm --locked --strategies crate-meta-data just@1.59.0

        # DotSlash release names differ from Rust triples. Supply their upstream
        # layout so every host gets a binary instead of falling back to compilation.
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=dotslash-linux-musl.x86_64.tar.gz ;;
          Linux/ARM64) asset=dotslash-linux-musl.aarch64.tar.gz ;;
          macOS/X64) asset=dotslash-macos-x86_64.tar.gz ;;
          macOS/ARM64) asset=dotslash-macos-arm64.tar.gz ;;
          Windows/X64) asset=dotslash-windows.tar.gz ;;
          Windows/ARM64) asset=dotslash-windows-arm64.tar.gz ;;
          *) printf 'Unsupported runner: %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2; exit 1 ;;
        esac

        cargo binstall --no-confirm --locked --strategies crate-meta-data \
          --pkg-url "https://github.com/facebook/dotslash/releases/download/v{version}/$asset" \
          --pkg-fmt tgz --bin-dir 'dotslash{binary-ext}' dotslash@0.5.7

    - name: Verify installed versions
      shell: bash
      run: |
        test "$(just --version)" = 'just 1.59.0'
        test "$(dotslash --version)" = 'DotSlash 0.5.7'

    # Save before builds so an unrelated failure does not discard tool installation.
    - name: Cache verified tool binaries
      if: steps.tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/just
          ~/.cargo/bin/just.exe
          ~/.cargo/bin/dotslash
          ~/.cargo/bin/dotslash.exe
        key: ${{ steps.tools.outputs.cache-primary-key }}
