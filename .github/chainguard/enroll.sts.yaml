# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
# Only enroll.yml running on main may open enrollment PRs.
# The subject uses this repository's immutable owner and repository IDs.
issuer: https://token.actions.githubusercontent.com
subject: repo:vados-cosmonic@123968127/cm-testsuite@1447064737:ref:refs/heads/main
claim_pattern:
  event_name: (issues|workflow_dispatch)
  job_workflow_ref: vados-cosmonic/cm-testsuite/\.github/workflows/enroll\.yml@refs/heads/main

permissions:
  contents: write
  pull_requests: write
