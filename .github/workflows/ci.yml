name: check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Windows C toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'amd64_arm64' || 'amd64' }}

      - name: Restore Buck action cache
        if: runner.os != 'Windows'
        id: cache
        uses: gilescope/rebuck@d4426bb4ad5a58134ad69f8c0afcdb2b43229865
        with:
          max-size-gb: "4"
          cache-key-prefix: cm-testsuite-buck-v1-${{ matrix.runner }}-${{ hashFiles('bins/buck2') }}
          # setup-buck2 also records the native toolchain's runner image identity.
          write-buckconfig-local: "false"
          force-cache-upload: "false"

      - name: Set up Buck2
        uses: $/.github/actions/setup-buck2
        with:
          cache-address: ${{ steps.cache.outputs.grpc-address }}

      - name: Check formatting before compilation
        run: just fmt-check

      - name: Lint the workspace
        run: just lint

      - name: Build shared CLI and test artifacts
        run: just ci-build

      - name: Run offline suites through Buck2
        run: just ci-test

      - name: Verify Cargo/Buck inputs and the local flow
        run: |
          just xtask buck-lock --check
          just demo
          just xtask validate

      - name: Check release tooling
        run: |
          dotslash bins/git-cliff --version
          just xtask release metadata --version 0.2.0-rc.1

      - name: Build documentation and submitted-results site
        run: just site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview-${{ matrix.runner }}
          path: site-out/

      - name: Upload Buck2 reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buck2-reports-${{ matrix.runner }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore
