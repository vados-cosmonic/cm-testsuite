name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: $/.github/actions/setup-tools

      - name: Format, test, and lint through the downloaded Rust toolchain
        run: just check

      - name: Build the task entrypoint
        run: just build

      - name: Verify Cargo/Buck inputs and the local flow
        run: |
          just xtask buck-lock --check
          just demo
          just xtask validate

      - name: Build documentation and submitted-results site
        run: just site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: site-out/
