name: check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Windows C toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'amd64_arm64' || 'amd64' }}

      - name: Set up tools
        uses: $/.github/actions/setup-tools

      - name: Format, test, and lint through the downloaded Rust toolchain
        run: just check

      - name: Build the task entrypoint
        run: just build

      - name: Verify Cargo/Buck inputs and the local flow
        run: |
          just xtask buck-lock --check
          just demo
          just xtask validate

      - name: Build documentation and submitted-results site
        run: just site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview-${{ matrix.runner }}
          path: site-out/
