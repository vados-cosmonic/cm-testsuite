# Adapted from bytecodealliance/jco; release logic lives in Rust xtask commands.
name: create-release-pr
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next workspace SemVer, without v (for example 0.2.0 or 0.2.0-rc.1)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: create-release-pr
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      # Exchanged with Octo-STS for a token scoped by .github/chainguard/create-release-pr.sts.yaml.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap pinned tools
        run: |
          bash scripts/bootstrap.sh
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Prepare version, lockfile, and changelog
        id: release
        env:
          NEXT_VERSION: ${{ inputs.version }}
        run: ./just xtask release prepare --version "$NEXT_VERSION" --github-output "$GITHUB_OUTPUT"
      - name: Check release changes
        run: |
          ./just check
          ./just xtask buck-lock --check
          git diff --check
      # Mint the write token only after the build, so build steps never see it.
      # Unlike GITHUB_TOKEN, a GitHub App token starts pull_request workflows
      # on the release PR, so required checks run.
      - name: Federate a release PR token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: create-release-pr
      - name: Ensure the release label exists
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: gh label create release-pr --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Reviewed release preparation" --force
      - name: Open release preparation PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          base: main
          branch: prep-release-${{ steps.release.outputs.tag }}
          commit-message: 'release: cm-testsuite v${{ steps.release.outputs.version }}'
          title: 'release: cm-testsuite v${{ steps.release.outputs.version }}'
          labels: release-pr
          signoff: true
          add-paths: |
            rust/Cargo.toml
            rust/Cargo.lock
            CHANGELOG.md
          body: |
            Prepare `${{ steps.release.outputs.tag }}`.

            - [ ] Review the version and changelog.
            - [ ] Confirm checks pass before merging.

            Merging into main tags the exact merge commit, builds the Linux artifact,
            publishes the GitHub release, and updates related issues or PRs.
