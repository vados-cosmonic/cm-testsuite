name: distribute-updates

on:
  schedule:
    - cron: '47 5 * * *'

  # Offer catalog changes to receiving repositories as soon as they land.
  push:
    branches:
      - main
    paths:
      - metadata/catalog.toml
      - corpus/**
      - registry/participants.toml
      - registry/participants/**/*.toml

  workflow_dispatch:
    inputs:
      only:
        description: 'Update only these enrolled repositories: comma-separated owner/repository names'
        default: ''
        type: string

      except:
        description: 'Skip these enrolled repositories: comma-separated owner/repository names'
        default: ''
        type: string

      publish:
        description: 'Open, update, or withdraw draft PRs'
        default: false
        type: boolean

permissions: {}

concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Exchange this workflow's identity for one Octo STS token per receiving repository.
      id-token: write
      # File or close the issue that tracks failing repositories.
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Buck2
        uses: $/.github/actions/setup-buck2

      - name: Build the command before it can request tokens
        run: just build

      - name: Distribute updates to enrolled repositories
        shell: bash
        env:
          # Reads repositories and files the failure issue; publishing uses Octo STS.
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          EXCEPT: ${{ inputs.except }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          args=()
          if [[ -n "$ONLY" ]]; then args+=(--only "$ONLY"); fi
          if [[ -n "$EXCEPT" ]]; then args+=(--except "$EXCEPT"); fi
          if [[ "$PUBLISH" == true ]]; then
            args+=(--publish --sts-identity cm-testsuite)
          fi
          # Unattended runs cover the whole registry and file failures in an
          # issue instead of failing.
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            args+=(--report-to "$GITHUB_REPOSITORY")
          fi

          status=0
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          just distribute "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
