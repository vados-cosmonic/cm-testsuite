name: gather-updates

on:
  schedule:
    - cron: '17 5 * * *'

  workflow_dispatch:
    inputs:
      only:
        description: 'Gather only these enrolled repositories: space-separated owner/repository names'
        default: ''
        type: string

      except:
        description: 'Skip these enrolled repositories: space-separated owner/repository names'
        default: ''
        type: string

      publish:
        description: 'Open or update the draft import PR'
        default: false
        type: boolean

permissions: {}

concurrency:
  group: gather
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Exchange this workflow's identity for an Octo STS token that opens the import PR.
      id-token: write
      # File or close the issue that tracks failing repositories.
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Buck2
        uses: $/.github/actions/setup-buck2

      - name: Build the command before it can request tokens
        run: just build

      - name: Gather updates from enrolled repositories
        shell: bash
        env:
          # Reads repositories and files the failure issue; publishing uses Octo STS.
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          EXCEPT: ${{ inputs.except }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          args=()
          for repository in $ONLY; do args+=(--only "$repository"); done
          for repository in $EXCEPT; do args+=(--except "$repository"); done
          if [[ "$PUBLISH" == true ]]; then
            args+=(--publish --sts-identity import)
          fi
          # Unattended runs cover the whole registry and file failures in an
          # issue instead of failing.
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            args+=(--report-to "$GITHUB_REPOSITORY")
          fi

          status=0
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          just gather "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
