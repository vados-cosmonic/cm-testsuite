name: propose-source-import

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Opted-in source identity: github:owner/repository'
        required: true
        type: string

      reference:
        description: 'Source branch or immutable commit'
        default: main
        required: true
        type: string

      manifest:
        description: 'Tracked source manifest path'
        default: .cm-testsuite.toml
        required: true
        type: string

      publish:
        description: 'Explicitly publish a draft PR using CM_TESTSUITE_TOKEN'
        default: false
        type: boolean

permissions: {}

concurrency:
  group: import-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up tools
        uses: $/.github/actions/setup-tools

      - name: Acquire and plan
        env:
          SOURCE: ${{ inputs.source }}
          REFERENCE: ${{ inputs.reference }}
          MANIFEST: ${{ inputs.manifest }}
          GITHUB_TOKEN: ${{ secrets.CM_TESTSUITE_TOKEN }}
        run: |
          just xtask acquire --source "$SOURCE" --reference "$REFERENCE" --manifest "$MANIFEST" --out "$RUNNER_TEMP/snapshot.toml"
          just xtask plan-import --snapshot "$RUNNER_TEMP/snapshot.toml" --out "$RUNNER_TEMP/import-plan.toml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: import-plan
          path: ${{ runner.temp }}/import-plan.toml

      - name: Publish draft PR
        if: inputs.publish
        env:
          TARGET: github:${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.CM_TESTSUITE_TOKEN }}
        run: just xtask publish --repository "$TARGET" --plan "$RUNNER_TEMP/import-plan.toml"
