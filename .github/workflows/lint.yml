name: Repository hygiene
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commits:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate every proposed commit
        env:
          START_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          END_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: npm exec --no -- commitlint --from "$START_REF" --to "$END_REF" --verbose
      - name: Validate the squash-merge title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm exec --no -- commitlint --verbose
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/zizmor.tar.gz"
          printf '%s  %s\n' bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b "$RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
          "$RUNNER_TEMP/zizmor" --offline .github
