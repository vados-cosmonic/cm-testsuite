name: repository-hygiene

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:

permissions: {}

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate every proposed commit
        env:
          START_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          END_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: npm exec --no -- commitlint --from "$START_REF" --to "$END_REF" --verbose

      - name: Validate the squash-merge title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm exec --no -- commitlint --verbose
