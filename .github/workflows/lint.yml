name: repository-hygiene

on:
  # No `edited` trigger: a title or description edit cannot change the commits.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

permissions: {}

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate every proposed commit
        env:
          START_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          END_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: npm exec --no -- commitlint --from "$START_REF" --to "$END_REF" --verbose
