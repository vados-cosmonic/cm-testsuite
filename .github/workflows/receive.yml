name: propose-receiving-update

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Opted-in target: owner/repository (without github: prefix)'
        required: true
        type: string

      publish:
        description: 'Open or update the draft PR in the target repository'
        default: false
        type: boolean

permissions: {}

concurrency:
  group: receive-${{ inputs.recipient }}
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Exchange this workflow's identity for an Octo STS token scoped to the target.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.recipient }}
          path: recipient-checkout
          persist-credentials: false

      - name: Set up Buck2
        uses: $/.github/actions/setup-buck2

      - name: Plan against the target default branch
        env:
          RECIPIENT: github:${{ inputs.recipient }}
        run: just xtask --root "$PWD/recipient-checkout" plan-receive --catalog-root "$PWD" --recipient "$RECIPIENT" --out "$RUNNER_TEMP/receive-plan.toml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receive-plan
          path: ${{ runner.temp }}/receive-plan.toml

      - name: Publish draft PR
        if: inputs.publish
        env:
          RECIPIENT: github:${{ inputs.recipient }}
          # Reads the repository; the write token comes from Octo STS.
          GITHUB_TOKEN: ${{ github.token }}
        run: just xtask publish --repository "$RECIPIENT" --plan "$RUNNER_TEMP/receive-plan.toml" --sts-identity cm-testsuite
