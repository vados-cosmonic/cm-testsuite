name: release
on:
  push:
    tags: ['cm-testsuite-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing cm-testsuite-vVERSION tag'
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Check release tag syntax before checkout
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Full SemVer validation is performed by xtask after checkout.
          [[ "$TAG" =~ ^cm-testsuite-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap pinned tools
        run: |
          bash scripts/bootstrap.sh
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Validate the exact release checkout
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./just xtask release validate --tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - name: Run release checks
        run: |
          ./just check
          ./just xtask buck-lock --check
          ./just demo
          ./just xtask validate
      - name: Package validated Linux binary and release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./buck2 build //:xtask --show-full-output > "$RUNNER_TEMP/xtask-output"
          binary=$(awk '$1 == "root//:xtask" { $1=""; sub(/^ /, ""); print }' "$RUNNER_TEMP/xtask-output")
          test -x "$binary"
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/release-artifacts"
          cp "$binary" "$RUNNER_TEMP/package/xtask"
          cp LICENSE THIRD_PARTY.md README.md "$RUNNER_TEMP/package/"
          tar -czf "$RUNNER_TEMP/release-artifacts/$TAG-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/package" .
          cd "$RUNNER_TEMP/release-artifacts"
          sha256sum ./*.tar.gz > SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          ./just xtask release extract-latest-changelog-section --version "$VERSION" --out "$RUNNER_TEMP/release-artifacts/RELEASE_NOTES.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release-artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if ! draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" \
              --notes-file release-artifacts/RELEASE_NOTES.md
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-artifacts/*.tar.gz release-artifacts/SHA256SUMS
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE" \
              --latest=false --notes-file release-artifacts/RELEASE_NOTES.md
          else
            # A published release is immutable to this workflow, including reruns.
            actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
            [[ "$actual" == "$PRERELEASE" ]]
            assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            printf '%s\n' "$assets" | grep -Fxq -- "$TAG-x86_64-unknown-linux-gnu.tar.gz"
            printf '%s\n' "$assets" | grep -Fxq -- SHA256SUMS
          fi

  notify:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: release-notifications
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap pinned tools
        run: |
          bash scripts/bootstrap.sh
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Update related issues or PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ./just xtask release post-release-issue-update --repository "$GITHUB_REPOSITORY" --tag "$TAG" --apply
