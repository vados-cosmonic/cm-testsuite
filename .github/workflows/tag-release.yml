name: tag-release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: 'Workspace SemVer, without v'
        type: string
        required: true
      ref:
        description: 'Commit or ref reachable from main to tag'
        type: string
        required: true

permissions: {}

jobs:

  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       startsWith(github.event.pull_request.title, 'release:') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Job-level, so skipped runs for unrelated closed PRs never queue here and
    # cannot replace a pending release run.
    concurrency:
      group: tag-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      # Lists the release PR's commits to check nothing else landed with it.
      pull-requests: read
    outputs:
      proceed: ${{ steps.event.outputs.proceed || steps.manual.outputs.proceed }}
      tag: ${{ steps.event.outputs.tag || steps.manual.outputs.tag }}
    steps:
      # Run the trusted main tooling; the xtask validates the target's committed files.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up tools
        uses: $/.github/actions/setup-tools
      # Build before any step receives a token, so dependency build scripts never see it.

      - name: Build release tooling
        run: just build

      - name: Validate merged release PR
        if: github.event_name == 'pull_request'
        id: event
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just xtask release from-event --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

      - name: Validate manual release version
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          VERSION: ${{ inputs.version }}
        run: just xtask release metadata --version "$VERSION" --github-output "$GITHUB_OUTPUT"

      - name: Create tag without moving an existing tag
        if: steps.event.outputs.proceed == 'true' || steps.manual.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.event.outputs.version || steps.manual.outputs.version }}
          TARGET_REF: ${{ steps.event.outputs.ref || inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: just xtask release tag --repository "$GITHUB_REPOSITORY" --version "$VERSION" --reference "$TARGET_REF" --apply

  release:
    needs: tag
    if: needs.tag.outputs.proceed == 'true'
    # GITHUB_TOKEN tag pushes do not trigger push workflows. Call explicitly.
    uses: $/.github/workflows/release.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
