# Adapted from bytecodealliance/jco (Apache-2.0); see THIRD_PARTY.md.
[changelog]
header = "# Changelog\n\n"
body = """
## [{{ version | trim_start_matches(pat="cm-testsuite-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true
[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
sort_commits = "oldest"
tag_pattern = '^cm-testsuite-v[0-9]+\.[0-9]+\.[0-9]+(?:[-+].*)?$'
commit_parsers = [
  { message = '^release:', skip = true },
  { message = '^feat', group = 'Features' },
  { message = '^fix', group = 'Fixes' },
  { message = '^sec', group = 'Security' },
  { message = '^perf', group = 'Performance' },
  { message = '^docs', group = 'Documentation' },
  { message = '.*', group = 'Maintenance' },
]
