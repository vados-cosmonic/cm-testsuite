# Settings shared by every enrolled repository, approved during review.
# Each repository is enrolled by its own file, participants/OWNER/REPO.toml;
# see participants/README.md.
# [[participant]] tables below are still read, but new enrollments add a file instead.
#
# maintainers = ["LOGIN"] # this repository's maintainers, mentioned on every failure report
schema = 1

[[participant]]
repository = "github:vados-cosmonic/cm-testsuite-test-source"
reference = "main"
maintainers = ["vados-cosmonic"]

[[participant]]
repository = "github:vados-cosmonic/cm-testsuite-test-receiver"
maintainers = ["vados-cosmonic"]
