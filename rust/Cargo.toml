[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
toml = "=0.8.23"
sha2 = "=0.10.9"
percent-encoding = "=2.3.2"
base64 = "=0.22.1"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls", "json"] }
wast = "=263.0.0"
clap = { version = "=4.6.7", features = ["derive"] }
tempfile = "=3.27.0"
cm-catalog = { path = "crates/catalog" }
cm-github = { path = "crates/github" }
cm-wast-analysis = { path = "crates/wast-analysis" }
cm-acquisition = { path = "crates/acquisition" }
cm-exchange-plan = { path = "crates/exchange-plan" }
cm-delivery = { path = "crates/delivery" }
cm-results = { path = "crates/results" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
