[package]
name = "xtask"
default-run = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
toml = { workspace = true, features = ["std", "serde", "parse", "display"] }

cm-catalog = { workspace = true }
cm-github = { workspace = true }
cm-wast-analysis = { workspace = true }
cm-acquisition = { workspace = true }
cm-exchange-plan = { workspace = true }
cm-delivery = { workspace = true }
cm-results = { workspace = true }
cm-release = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true, features = ["getrandom"] }
